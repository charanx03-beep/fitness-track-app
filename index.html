<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js for visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Phosphor Icons for simple, clean icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <i class="ph ph-activity logo-icon"></i>
                <h1>FitTrack</h1>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active" data-target="dashboard">
                    <i class="ph ph-squares-four"></i> Dashboard
                </a>
                <a href="#" class="nav-item" data-target="log-activity">
                    <i class="ph ph-plus-circle"></i> Log Activity
                </a>
                <a href="#" class="nav-item" data-target="history">
                    <i class="ph ph-clock-counter-clockwise"></i> History
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h2>Welcome back! 👋</h2>
                <div class="user-profile">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="User Avatar" class="avatar">
                </div>
            </header>

            <div class="content-sections">
                <!-- Dashboard Section -->
                <section id="dashboard" class="section active">
                    <div class="stats-grid">
                        <div class="stat-card glass">
                            <div class="stat-header">
                                <h3>Steps</h3>
                                <i class="ph ph-sneaker"></i>
                            </div>
                            <div class="stat-value" id="total-steps">0</div>
                            <div class="progress-bar">
                                <div class="progress" id="steps-progress" style="width: 0%"></div>
                            </div>
                            <div class="stat-target">Target: 10,000</div>
                        </div>
                        <div class="stat-card glass">
                            <div class="stat-header">
                                <h3>Calories Burned</h3>
                                <i class="ph ph-fire"></i>
                            </div>
                            <div class="stat-value" id="total-calories">0 kcal</div>
                        </div>
                        <div class="stat-card glass">
                            <div class="stat-header">
                                <h3>Active Minutes</h3>
                                <i class="ph ph-timer"></i>
                            </div>
                            <div class="stat-value" id="total-duration">0 min</div>
                        </div>
                    </div>

                    <div class="chart-container glass">
                        <h3>Weekly Activity (Calories)</h3>
                        <canvas id="activityChart"></canvas>
                    </div>
                </section>

                <!-- Log Activity Section -->
                <section id="log-activity" class="section">
                    <div class="form-container glass">
                        <h3>Log New Activity</h3>
                        <form id="activity-form">
                            <div class="form-group">
                                <label for="activity-type">Activity Type</label>
                                <select id="activity-type" required>
                                    <option value="" disabled selected>Select an activity</option>
                                    <option value="Running">Running</option>
                                    <option value="Cycling">Cycling</option>
                                    <option value="Walking">Walking</option>
                                    <option value="Swimming">Swimming</option>
                                    <option value="Yoga">Yoga</option>
                                    <option value="Weightlifting">Weightlifting</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>

                            <div class="form-group" id="steps-group" style="display: none;">
                                <label for="activity-steps">Steps (Optional)</label>
                                <input type="number" id="activity-steps" placeholder="e.g. 5000" min="0">
                            </div>

                            <div class="form-row">
                                <div class="form-group half">
                                    <label for="activity-duration">Duration (Minutes)</label>
                                    <input type="number" id="activity-duration" placeholder="e.g. 30" required min="1">
                                </div>
                                <div class="form-group half">
                                    <label for="activity-calories">Calories Burned</label>
                                    <input type="number" id="activity-calories" placeholder="e.g. 300" required min="1">
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="activity-date">Date</label>
                                <input type="date" id="activity-date" required>
                            </div>

                            <button type="submit" class="btn-primary">Save Activity</button>
                        </form>
                    </div>
                </section>

                <!-- History Section -->
                <section id="history" class="section">
                    <div class="history-container glass">
                        <div class="history-header">
                            <h3>Activity History</h3>
                            <button id="clear-data-btn" class="btn-danger btn-sm">Clear All Data</button>
                        </div>
                        <ul id="activity-list" class="activity-list">
                            <!-- Activity items will be injected here via JS -->
                        </ul>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>

</html>
